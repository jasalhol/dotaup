<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota Kill Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0d14;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 32px 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px 10px 14px;
      background: #16161f;
      border-radius: 12px;
      border: 1px solid #1e1e2e;
      transition: border-color 0.2s, opacity 0.3s;
      position: relative;
      will-change: transform;
    }

    .card.maxed {
      opacity: 0.45;
      pointer-events: none;
    }
    .card.maxed .btn-plus {
      visibility: hidden;
    }

    /* Re-enable - button on maxed cards */
    .card.maxed {
      pointer-events: auto;
    }
    .card.maxed .btn-plus {
      pointer-events: none;
      opacity: 0;
    }

    .avatar-wrap {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #2a2a3e;
      flex-shrink: 0;
    }

    .card.maxed .avatar-wrap {
      filter: grayscale(1);
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    .avatar-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1e2e;
      font-size: 1rem;
      font-weight: 600;
      color: #555;
      letter-spacing: 0.04em;
    }

    .hero-name {
      font-size: 0.68rem;
      color: #555;
      text-align: center;
      line-height: 1.3;
      max-width: 100%;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid #2a2a3e;
      background: #1e1e2e;
      color: #aaa;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      user-select: none;
      flex-shrink: 0;
    }

    .btn:hover {
      background: #252535;
      color: #fff;
      border-color: #3a3a50;
    }

    .btn:active {
      background: #2e2e42;
    }

    .count {
      min-width: 32px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: #e0e0e0;
      outline: none;
      border-radius: 4px;
      padding: 1px 2px;
      cursor: text;
      transition: background 0.15s;
    }

    .count:focus {
      background: #1e1e2e;
      color: #fff;
    }

    .count:focus-visible {
      outline: 1px solid #3a3a50;
    }

    .search-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    #search {
      width: 100%;
      max-width: 320px;
      background: #16161f;
      border: 1px solid #1e1e2e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.85rem;
      padding: 8px 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    #search::placeholder { color: #3a3a50; }
    #search:focus { border-color: #3a3a50; }

    #btn-reset {
      background: none;
      border: 1px solid #2a2a3e;
      border-radius: 8px;
      color: #444;
      font-size: 0.8rem;
      padding: 8px 14px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    #btn-reset:hover { border-color: #c23b22; color: #c23b22; }

    .card.hidden { display: none; }
  </style>
</head>
<body>
  <h1>Kill Tracker</h1>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search heroes…" autocomplete="off" spellcheck="false">
    <button id="btn-reset">Reset all</button>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    const HEROES = [
      { id: 0,  name: 'Skywrath Mage',           key: 'skywrath_mage',     start: 9  },
      { id: 1,  name: 'Leshrac',                  key: 'leshrac',           start: 15 },
      { id: 2,  name: 'Dazzle',                   key: 'dazzle',            start: 34 },
      { id: 3,  name: 'Prophet',                  key: 'furion',            start: 22 },
      { id: 4,  name: 'Luna',                     key: 'luna',              start: 24 },
      { id: 5,  name: 'Chaos Knight',             key: 'chaos_knight',      start: 17 },
      { id: 6,  name: 'Medusa',                   key: 'medusa',            start: 25 },
      { id: 7,  name: 'Butcher',                  key: 'pudge',             start: 14 },
      { id: 8,  name: 'Ursa',                     key: 'ursa',              start: 11 },
      { id: 9,  name: 'Crystal Maiden',           key: 'crystal_maiden',    start: 17 },
      { id: 10, name: 'Dawn Morningstar',         key: 'dawnbreaker',       start: 9  },
      { id: 11, name: 'Magnus',                   key: 'magnataur',         start: 8  },
      { id: 12, name: 'Mirana',                   key: 'mirana',            start: 24 },
      { id: 13, name: 'Razor',                    key: 'razor',             start: 31 },
      { id: 14, name: 'Gyrocopter',               key: 'gyrocopter',        start: 38 },
      { id: 15, name: 'Kunkka',                   key: 'kunkka',            start: 14 },
      { id: 16, name: 'Puck',                     key: 'puck',              start: 11 },
      { id: 17, name: 'Vengeful Spirit',          key: 'vengefulspirit',    start: 16 },
      { id: 18, name: 'Tusk',                     key: 'tusk',              start: 11 },
      { id: 19, name: 'Invoker',                  key: 'invoker',           start: 16 },
      { id: 20, name: 'Templar Assassin',         key: 'templar_assassin',  start: 35 },
      { id: 21, name: 'Omniknight',               key: 'omniknight',        start: 11 },
      { id: 22, name: 'Centaur Warrunner',        key: 'centaur',           start: 7  },
      { id: 23, name: 'Legion Commander',         key: 'legion_commander',  start: 16 },
      { id: 24, name: 'Shadow Fiend',             key: 'nevermore',         start: 37 },
      { id: 25, name: 'Dominator',                key: 'doom_bringer',      start: 33 },
      { id: 26, name: 'Lina',                     key: 'lina',              start: 28 },
      { id: 27, name: 'Enigma',                   key: 'enigma',            start: 21 },
      { id: 28, name: 'Phoenix',                  key: 'phoenix',           start: 10 },
      { id: 29, name: 'Vengeful Spirit (Alt)',    key: 'vengefulspirit',    start: 20 },
      { id: 30, name: 'Zeus',                     key: 'zuus',              start: 9  },
      { id: 31, name: 'Wraith King',              key: 'skeleton_king',     start: 10 },
      { id: 32, name: 'Morphling',                key: 'morphling',         start: 17 },
      { id: 33, name: 'Enchantress',              key: 'enchantress',       start: 14 },
    ];

    const MAX = 50;
    const IMG_BASE = 'https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/';

    // Load saved counts or fall back to CSV starting values
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem('kills') || '{}'); } catch {}
    const counts = HEROES.map(h => saved[h.id] !== undefined ? saved[h.id] : 0);

    function save() {
      const obj = {};
      counts.forEach((c, i) => obj[i] = c);
      localStorage.setItem('kills', JSON.stringify(obj));
    }

    function initials(name) {
      return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
    }

    const CHECKPOINTS = [10, 20, 30, 40, 50];

    function distanceToCheckpoint(id) {
      const c = counts[id];
      for (const cp of CHECKPOINTS) {
        if (c < cp) return cp - c;
      }
      return Infinity; // maxed
    }

    let sortTimer = null;
    function debouncedSort() {
      clearTimeout(sortTimer);
      sortTimer = setTimeout(() => sortAndAnimate(true), 2000);
    }

    function applyFilter() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      Array.from(grid.children).forEach(card => {
        const id = parseInt(card.id.split('-')[1]);
        const match = !q || HEROES[id].name.toLowerCase().includes(q);
        card.classList.toggle('hidden', !match);
      });
    }

    function sortAndAnimate(animate = true) {
      const cards = Array.from(grid.children).filter(c => !c.classList.contains('hidden'));

      // FIRST: snapshot positions before reorder
      const firsts = new Map();
      if (animate) {
        cards.forEach(card => firsts.set(card.id, card.getBoundingClientRect()));
      }

      // Sort ascending: closest to next checkpoint first; maxed go last
      cards.sort((a, b) =>
        distanceToCheckpoint(parseInt(a.id.split('-')[1])) -
        distanceToCheckpoint(parseInt(b.id.split('-')[1]))
      );

      // Reorder DOM
      cards.forEach(card => grid.appendChild(card));

      if (!animate) return;

      // LAST: read new positions (forces layout), then INVERT
      const lasts = new Map();
      cards.forEach(card => lasts.set(card.id, card.getBoundingClientRect()));

      cards.forEach(card => {
        const f = firsts.get(card.id);
        const l = lasts.get(card.id);
        const dx = f.left - l.left;
        const dy = f.top - l.top;
        if (dx === 0 && dy === 0) return;
        card.style.transition = 'none';
        card.style.transform = `translate(${dx}px, ${dy}px)`;
      });

      // PLAY: double-rAF ensures browser has painted the snapped position
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          cards.forEach(card => {
            card.style.transition = 'transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
            card.style.transform = '';
          });
        });
      });
    }

    function updateCard(id) {
      const card = document.getElementById('card-' + id);
      const countEl = card.querySelector('.count');
      const btnPlus = card.querySelector('.btn-plus');
      countEl.textContent = counts[id];
      if (counts[id] >= MAX) {
        card.classList.add('maxed');
        btnPlus.disabled = true;
      } else {
        card.classList.remove('maxed');
        btnPlus.disabled = false;
      }
    }

    function increment(id) {
      if (counts[id] < MAX) {
        counts[id]++;
        save();
        updateCard(id);
        debouncedSort();
      }
    }

    function decrement(id) {
      if (counts[id] > 0) {
        counts[id]--;
        save();
        updateCard(id);
        debouncedSort();
      }
    }

    function onEdit(id, el) {
      const raw = parseInt(el.textContent.trim(), 10);
      const val = isNaN(raw) ? counts[id] : Math.max(0, Math.min(MAX, raw));
      counts[id] = val;
      save();
      updateCard(id);
      sortAndAnimate();
    }

    function buildCard(h) {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-' + h.id;

      // Avatar
      const avatarWrap = document.createElement('div');
      avatarWrap.className = 'avatar-wrap';

      const img = document.createElement('img');
      img.src = IMG_BASE + h.key + '.png';
      img.alt = h.name;
      img.onerror = function() {
        avatarWrap.innerHTML = '';
        const fb = document.createElement('div');
        fb.className = 'avatar-fallback';
        fb.textContent = initials(h.name);
        avatarWrap.appendChild(fb);
      };
      avatarWrap.appendChild(img);
      card.appendChild(avatarWrap);

      // Name
      const name = document.createElement('div');
      name.className = 'hero-name';
      name.textContent = h.name;
      card.appendChild(name);

      // Controls
      const controls = document.createElement('div');
      controls.className = 'controls';

      const btnMinus = document.createElement('button');
      btnMinus.className = 'btn btn-minus';
      btnMinus.textContent = '−';
      btnMinus.title = 'Decrease';
      btnMinus.addEventListener('click', () => decrement(h.id));

      const countEl = document.createElement('span');
      countEl.className = 'count';
      countEl.contentEditable = 'true';
      countEl.spellcheck = false;
      countEl.textContent = counts[h.id];
      countEl.addEventListener('focus', function() {
        // Select all on focus
        const range = document.createRange();
        range.selectNodeContents(this);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      });
      countEl.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); this.blur(); }
        // Allow only digits, backspace, delete, arrows
        if (!e.metaKey && !e.ctrlKey && !/^(Backspace|Delete|Arrow|Tab|Enter|\d)/.test(e.key)) {
          e.preventDefault();
        }
      });
      countEl.addEventListener('blur', function() { onEdit(h.id, this); });

      const btnPlus = document.createElement('button');
      btnPlus.className = 'btn btn-plus';
      btnPlus.textContent = '+';
      btnPlus.title = 'Increase';
      btnPlus.addEventListener('click', () => increment(h.id));

      controls.appendChild(btnMinus);
      controls.appendChild(countEl);
      controls.appendChild(btnPlus);
      card.appendChild(controls);

      return card;
    }

    const grid = document.getElementById('grid');
    HEROES.forEach(h => {
      const card = buildCard(h);
      grid.appendChild(card);
      updateCard(h.id);
    });
    sortAndAnimate(false);

    document.getElementById('search').addEventListener('input', applyFilter);

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (!confirm('Reset all kill counts to 0?')) return;
      counts.fill(0);
      save();
      HEROES.forEach(h => updateCard(h.id));
      sortAndAnimate(false);
    });
  </script>
</body>
</html>
